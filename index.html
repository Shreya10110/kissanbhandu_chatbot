<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>KisanBandhu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --green-deep: #2F5233;
      --green-mid: #3F6B44;
      --gold: #E8A33D;
      --gold-deep: #C77F1F;
      --indigo: #1B4B66;
      --cream: #F6F3EA;
      --cream-card: #FFFFFF;
      --ink: #20281F;
      --ink-soft: #5B6459;
      --line: #E3DFD0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--cream);
      background-image:
        linear-gradient(180deg, rgba(47, 82, 51, 0.04), transparent 220px),
        repeating-linear-gradient(180deg, rgba(47, 82, 51, 0.035) 0px, rgba(47, 82, 51, 0.035) 2px, transparent 2px, transparent 34px);
      font-family: 'Noto Sans', 'Noto Sans Devanagari', sans-serif;
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 24px 14px;
      min-height: 100%;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      height: min(760px, 92vh);
      background: var(--cream-card);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(32, 40, 31, 0.06), 0 18px 40px -20px rgba(32, 40, 31, 0.35);
      border: 1px solid var(--line);
    }

    /* header */
    .header {
      background: linear-gradient(155deg, var(--green-deep), var(--green-mid));
      padding: 20px 20px 22px;
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: "";
      position: absolute;
      right: -30px;
      top: -30px;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(232, 163, 61, 0.25), transparent 70%);
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
    }

    .logo-mark svg {
      width: 26px;
      height: 26px;
    }

    .header-text h1 {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.28rem;
      color: #fff;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .header-text p {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.78);
      font-weight: 500;
    }

    .status-pill {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 5px 10px 5px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8FE38A;
      box-shadow: 0 0 0 3px rgba(143, 227, 138, 0.25);
    }

    /* chat area */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 10px;
    }

    .row {
      display: flex;
      gap: 9px;
      max-width: 100%;
    }

    .row.bot {
      align-self: flex-start;
    }

    .row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .avatar.bot {
      background: var(--green-deep);
    }

    .avatar.user {
      background: var(--indigo);
    }

    .avatar svg {
      width: 16px;
      height: 16px;
    }

    .bubble-wrap {
      max-width: 78%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row.user .bubble-wrap {
      align-items: flex-end;
    }

    .bubble {
      padding: 11px 13px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .row.bot .bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-top-left-radius: 4px;
      color: var(--ink);
    }

    .row.user .bubble {
      background: var(--indigo);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .stamp-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.66rem;
      color: var(--gold-deep);
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      padding-left: 2px;
    }

    .stamp-badge {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.4px solid var(--gold-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stamp-badge::before {
      content: "✓";
      font-size: 9px;
      color: var(--gold-deep);
      font-weight: 900;
    }

    .source-tag {
      font-size: 0.68rem;
      color: var(--ink-soft);
      background: var(--cream);
      border: 1px solid var(--line);
      padding: 3px 8px;
      border-radius: 8px;
      display: inline-block;
      width: fit-content;
    }

    /* suggestion chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 16px 14px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1.3px solid var(--line);
      padding: 8px 12px;
      border-radius: 11px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--green-deep);
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .chip:hover {
      border-color: var(--gold);
      background: #FFFBF2;
      transform: translateY(-1px);
    }

    .chip svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* input bar */
    .input-bar {
      border-top: 1px solid var(--line);
      background: #fff;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-shell {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--cream);
      border: 1.4px solid var(--line);
      border-radius: 13px;
      padding: 5px 6px 5px 13px;
    }

    .input-shell input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.88rem;
      font-family: inherit;
      color: var(--ink);
      padding: 6px 4px;
    }

    .input-shell input::placeholder {
      color: #9AA294;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink-soft);
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(47, 82, 51, 0.08);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: none;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
      transition: background 0.12s ease;
    }

    .send-btn:hover {
      background: var(--gold-deep);
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 13px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      border-top-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #B7BFAE;
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing span {
        animation: none;
      }

      .chip {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="header">
      <div class="header-row">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2C12 2 7 6 7 12c0 3 2 5 5 5s5-2 5-5c0-6-5-10-5-10z" fill="#2F5233" />
            <path d="M12 17v5M8 21h8" stroke="#2F5233" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </div>
        <div class="header-text">
          <h1>KisanBandhu</h1>
          <p>Your farming advisory companion</p>
        </div>
        <select id="langSelect" style="background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.24); color: #fff; border-radius: 8px; padding: 5px 8px; font-size: 0.75rem; outline: none; cursor: pointer; font-weight: 600; margin-left: auto;">
          <option value="en" style="color: #20281F;">🇬🇧 English</option>
          <option value="hi" style="color: #20281F;">🇮🇳 हिंदी (Hindi)</option>
          <option value="mr" style="color: #20281F;">🇮🇳 मराठी (Marathi)</option>
        </select>
      </div>
    </div>

    <div class="chat" id="chat">

      <div class="row bot">
        <div class="avatar bot">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2C12 2 7 6 7 12c0 3 2 5 5 5s5-2 5-5c0-6-5-10-5-10z" fill="#fff" />
          </svg>
        </div>
        <div class="bubble-wrap">
          <div class="bubble">Namaste 🙏 I'm KisanBandhu. Ask me about farming.</div>
        </div>
      </div>

    </div>

    <div class="input-bar">
      <div class="input-shell">
        <input id="msgInput" type="text" placeholder="Type your question... / अपना सवाल लिखें..." />
        <button class="icon-btn" title="Voice input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10a7 7 0 0 0 14 0M12 19v3" />
          </svg>
        </button>
      </div>
      <button class="send-btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2F5233" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M22 2L11 13" />
          <path d="M22 2l-7 20-4-9-9-4 20-7z" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const chips = document.getElementById('chips');

    // Demo knowledge base — replace this with a fetch() call to your Flask/FastAPI
    // backend wrapping search_index() from rag_pipeline.py
    const demoAnswers = {
      "when should i sow wheat?": {
        text: "Sow wheat in the first week of November using zero tillage, with late sowing possible up to 20th December. For late-sown wheat, increase seed rate by 10–20%. Maintain 50cm row spacing and use about 20kg seed per hectare.",
        source: "ICAR Rabi Agro-Advisory · Zone IV"
      },
      "how much irrigation does paddy need?": {
        text: "Paddy typically needs standing water of 2–5cm during vegetative growth. Critical stages needing timely irrigation are tillering, panicle initiation, and flowering — avoid water stress especially at flowering.",
        source: "Water Management — Paddy Advisory"
      },
      "which pesticide should i use for aphids?": {
        text: "For aphid control, monitor for natural predators first. If infestation crosses threshold, use recommended systemic insecticides at label dosage, applied in early morning or evening to avoid harming pollinators.",
        source: "Pesticides Brochure — ICAR"
      },
      "what fertilizer is best for this rabi season?": {
        text: "For Rabi cereals, apply a balanced NPK dose based on soil test — commonly a higher nitrogen split with full phosphorus and potash at sowing, plus a top-dressing of nitrogen at the first irrigation.",
        source: "ICAR Rabi Agro-Advisory"
      }
    };

    function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }

    function addUserMessage(text) {
      const row = document.createElement('div');
      row.className = 'row user';
      row.innerHTML = `
    <div class="avatar user"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></div>
    <div class="bubble-wrap"><div class="bubble"></div></div>`;
      row.querySelector('.bubble').textContent = text;
      chat.appendChild(row);
      scrollToBottom();
    }

    function addTyping() {
      const row = document.createElement('div');
      row.className = 'row bot';
      row.id = 'typingRow';
      row.innerHTML = `
    <div class="avatar bot"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 7 6 7 12c0 3 2 5 5 5s5-2 5-5c0-6-5-10-5-10z" fill="#fff"/></svg></div>
    <div class="typing"><span></span><span></span><span></span></div>`;
      chat.appendChild(row);
      scrollToBottom();
    }

    function addBotMessage(text, source) {
      const typingRow = document.getElementById('typingRow');
      if (typingRow) typingRow.remove();
      const row = document.createElement('div');
      row.className = 'row bot';
      row.innerHTML = `
    <div class="avatar bot"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 7 6 7 12c0 3 2 5 5 5s5-2 5-5c0-6-5-10-5-10z" fill="#fff"/></svg></div>
    <div class="bubble-wrap">
      <div class="stamp-row"><span class="stamp-badge"></span>Verified advisory</div>
      <div class="bubble"></div>
      <div class="source-tag"></div>
    </div>`;
      row.querySelector('.bubble').textContent = text;
      row.querySelector('.source-tag').textContent = source;
      chat.appendChild(row);
      scrollToBottom();
    }

    // Configure your Hugging Face Space URL here if you want to deploy the frontend separately (e.g. 'https://username-space.hf.space')
    const BACKEND_URL = '';

    const langSelect = document.getElementById('langSelect');

    const welcomeMessages = {
      en: "Namaste 🙏 I'm KisanBandhu. Ask me about farming.",
      hi: "नमस्ते 🙏 मैं किसानबंधु हूँ। मुझसे खेती के बारे में पूछें।",
      mr: "नमस्कार 🙏 मी किसानबंधू आहे. मला शेतीबद्दल विचारा."
    };

    const placeholders = {
      en: "Type your question...",
      hi: "अपना सवाल लिखें...",
      mr: "तुमचा प्रश्न लिहा..."
    };

    langSelect.addEventListener('change', (e) => {
      const selectedLang = e.target.value;
      input.placeholder = placeholders[selectedLang] || placeholders.en;
      const firstBubble = document.querySelector('.chat .row.bot .bubble');
      if (firstBubble) {
        firstBubble.textContent = welcomeMessages[selectedLang] || welcomeMessages.en;
      }
    });

    async function handleQuery(question) {
      if (!question.trim()) return;
      addUserMessage(question);
      input.value = '';
      addTyping();

      const selectedLang = langSelect.value;
      const apiEndpoint = BACKEND_URL ? `${BACKEND_URL.replace(/\/$/, '')}/api/ask` : '/api/ask';

      try {
        const res = await fetch(apiEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ q: question, lang: selectedLang })
        });
        const data = await res.json();
        addBotMessage(data.answer, data.source || "KisanBandhu Advisory Database");
      } catch (err) {
        console.error(err);
        addBotMessage("Sorry, I encountered an error connecting to the advisory database.", "Error");
      }
    }

    sendBtn.addEventListener('click', () => handleQuery(input.value));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleQuery(input.value); });
    chips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (chip) handleQuery(chip.dataset.q);
    });
  </script>

</body>

</html>
